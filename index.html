<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <!-- Geen in- of uitzoomen: nodig om blokken te kunnen slepen in de IQ-test -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#170c07">
  <title>Quiz – Meedoen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body class="player">
  <div class="bg"></div><div class="glow"></div><div class="vignette"></div>
  <div id="banner" class="banner" hidden></div>

  <header class="topbar" id="playerBar" hidden>
    <strong id="meName"></strong>
    <span id="meTeam" class="team-tag" hidden></span>
    <span id="meScore" class="score-tag">0</span>
  </header>

  <main>
    <section id="v-loading" class="view center">
      <p id="loadingText" class="waiting">Even geduld…</p>
    </section>

    <!-- STAP 1: CODE -->
    <section id="v-code" class="view center" hidden>
      <h1>Doe mee met de quiz</h1>
      <form id="codeForm" class="form">
        <label>Geef de code in die op het grote scherm staat
          <input id="pinInput" class="code-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" required autocomplete="off">
        </label>
        <p id="codeError" class="error" hidden></p>
        <button class="plaque wide" id="codeBtn"><span class="plaque-text">Verder</span></button>
      </form>
    </section>

    <!-- STAP 2: NAAM -->
    <section id="v-name" class="view center" hidden>
      <h1 id="gameTitle"></h1>
      <form id="nameForm" class="form">
        <label>Wat is je naam?
          <input id="nameInput" maxlength="16" placeholder="Naam" required autocomplete="off">
        </label>
        <p id="nameError" class="error" hidden></p>
        <button class="plaque wide" id="nameBtn"><span class="plaque-text">Meedoen</span></button>
      </form>
      <p><button id="backBtn" class="link-btn">Andere code</button></p>
    </section>

    <!-- LOBBY -->
    <section id="v-lobby" class="view center" hidden>
      <h1>Je doet mee!</h1>
      <p class="waiting">Kijk naar het grote scherm. De quiz begint zo…</p>
      <div id="teamPick" class="panel" hidden>
        <h2>Kies je groep</h2>
        <div id="teamButtons" class="team-buttons"></div>
      </div>
    </section>

    <!-- WACHTEN TUSSEN RONDES -->
    <section id="v-wait" class="view center" hidden>
      <h1>Maak je klaar</h1>
      <p class="waiting">De volgende ronde komt eraan…</p>
    </section>

    <!-- VRAAG -->
    <section id="v-question" class="view" hidden>
      <div class="qtop">
        <div class="plaque counter"><span class="plaque-text" id="qCount"></span></div>
        <div class="plaque timer" id="timerBox"><span class="plaque-text" id="timer"></span></div>
      </div>
      <div class="fuse"><div class="fuse-fill" id="fuse"></div></div>
      <div class="plaque question"><span class="plaque-text" id="qText"></span></div>
      <div id="qMedia" class="media" hidden></div>
      <div id="qBody"></div>
      <div id="qStatus" class="status" hidden></div>
    </section>

    <!-- SPELLETJES -->
    <section id="v-game" class="view" hidden>
      <div class="qtop">
        <div class="plaque counter"><span class="plaque-text" id="gName"></span></div>
        <div class="plaque timer" id="gTimerBox" hidden><span class="plaque-text" id="gTimer"></span></div>
      </div>
      <h2 id="gTitle" class="game-title"></h2>
      <p class="hint" id="gSub"></p>
      <div id="gBody"></div>
    </section>

    <!-- RESULTAAT -->
    <section id="v-result" class="view center" hidden>
      <p id="resultTitle" class="result-title"></p>
      <p id="resultPoints" class="points"></p>
      <p id="resultDetail" class="muted"></p>
      <div id="resultMap"></div>
      <p id="resultAnswer"></p>
      <p id="resultRank" class="muted"></p>
    </section>

    <!-- EINDE -->
    <section id="v-end" class="view center" hidden>
      <h1>Einde van de quiz</h1>
      <p id="endRank" class="result-title good"></p>
      <p id="endScore" class="points"></p>
      <p id="endTeam" class="muted"></p>
    </section>
  </main>

  <div id="intro" class="intro" hidden>
    <div class="plaque"><span class="plaque-text" id="introText"></span></div>
    <p>Maak je klaar…</p>
  </div>

  <script src="js/firebase-config.js?v=5"></script>
  <script src="js/store.js?v=5"></script>
  <script src="js/sfx.js?v=5"></script>
  <script src="js/fx.js?v=5"></script>
  <script src="js/scene.js?v=5"></script>
  <script src="js/common.js?v=5"></script>
  <script src="js/iq-puzzles.js?v=5"></script>
  <script src="js/iq-game.js?v=5"></script>
  <script src="js/player.js?v=5"></script>
</body>
</html>
